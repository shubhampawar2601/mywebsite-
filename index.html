<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shubham Portfolio</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#080b14;
    color:white;
    overflow-x:hidden;
}

/* ================= INTRO ================= */

#intro{
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 50% 40%,#18213b,#080b14 65%);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.introBox{
    text-align:center;
}

.introTitle{
    font-size:45px;
    letter-spacing:8px;
    font-weight:700;
    animation:titleGlow 2s infinite alternate;
}

@keyframes titleGlow{
    from{opacity:.45;transform:scale(.97)}
    to{opacity:1;transform:scale(1)}
}

.loading{
    width:240px;
    height:4px;
    background:#202638;
    margin:25px auto 0;
    overflow:hidden;
    border-radius:10px;
}

.loadingBar{
    height:100%;
    width:0;
    background:#4f8cff;
    animation:load 3s forwards;
}

@keyframes load{
    to{width:100%}
}

/* ================= MAN SCENE ================= */

#manScene{
    position:fixed;
    inset:0;
    background:
      linear-gradient(to bottom,#101827 0%,#080b12 72%);
    z-index:9998;
    display:none;
    overflow:hidden;
}

/* floor */

.floor{
    position:absolute;
    bottom:0;
    width:100%;
    height:25%;
    background:
      linear-gradient(#111827,#080b12);
    border-top:1px solid rgba(255,255,255,.05);
}

.floor:after{
    content:"";
    position:absolute;
    top:35px;
    left:0;
    width:100%;
    height:1px;
    background:rgba(255,255,255,.06);
}

/* Man */

.man{
    position:absolute;
    bottom:23%;
    left:-180px;
    width:120px;
    height:250px;
    animation:walkIn 4s ease-out forwards;
}

@keyframes walkIn{
    0%{left:-180px}
    100%{left:42%}
}

/* shadow */

.manShadow{
    position:absolute;
    bottom:-8px;
    left:5px;
    width:110px;
    height:18px;
    border-radius:50%;
    background:rgba(0,0,0,.65);
    filter:blur(5px);
}

/* head */

.head{
    position:absolute;
    width:58px;
    height:65px;
    border-radius:48% 48% 45% 45%;
    background:linear-gradient(135deg,#d99a72,#a96545);
    left:31px;
    top:0;
    z-index:4;
}

/* hair */

.hair{
    position:absolute;
    width:62px;
    height:30px;
    background:#17130f;
    border-radius:55% 55% 25% 25%;
    left:-2px;
    top:-4px;
}

/* ear */

.ear{
    position:absolute;
    width:10px;
    height:18px;
    border-radius:50%;
    background:#bd7655;
    top:27px;
}

.ear.left{left:-5px}
.ear.right{right:-5px}

/* face */

.eye{
    position:absolute;
    width:6px;
    height:4px;
    background:#161616;
    border-radius:50%;
    top:31px;
}

.eye.one{left:17px}
.eye.two{right:17px}

.nose{
    position:absolute;
    width:7px;
    height:11px;
    border-right:2px solid #935b45;
    top:35px;
    left:27px;
}

.mouth{
    position:absolute;
    width:15px;
    height:5px;
    border-bottom:2px solid #7c4035;
    border-radius:50%;
    bottom:12px;
    left:22px;
}

/* neck */

.neck{
    position:absolute;
    width:25px;
    height:22px;
    background:#ae694c;
    left:47px;
    top:57px;
    z-index:2;
}

/* body / shirt */

.body{
    position:absolute;
    width:83px;
    height:105px;
    background:linear-gradient(135deg,#263d68,#15243f);
    border-radius:25px 25px 10px 10px;
    left:19px;
    top:70px;
    z-index:3;
}

/* shirt detail */

.shirtLine{
    position:absolute;
    width:2px;
    height:75px;
    background:rgba(255,255,255,.08);
    left:40px;
    top:12px;
}

/* arms */

.arm{
    position:absolute;
    width:23px;
    height:92px;
    background:linear-gradient(#bd7655,#94543f);
    border-radius:20px;
    top:77px;
    z-index:2;
}

.arm.left{
    left:4px;
    transform:rotate(10deg);
}

.arm.right{
    right:3px;
    transform:rotate(-12deg);
}

/* hands */

.hand{
    position:absolute;
    width:20px;
    height:22px;
    border-radius:50%;
    background:#b96d4e;
    bottom:-10px;
}

/* legs */

.leg{
    position:absolute;
    width:29px;
    height:85px;
    background:linear-gradient(#1c2738,#111827);
    top:164px;
    border-radius:8px 8px 13px 13px;
}

.leg.left{
    left:30px;
    transform:rotate(3deg);
}

.leg.right{
    right:30px;
    transform:rotate(-3deg);
}

/* shoes */

.shoe{
    position:absolute;
    width:43px;
    height:19px;
    background:#050505;
    border-radius:15px 12px 5px 5px;
    bottom:-6px;
}

.leg.left .shoe{left:-10px}
.leg.right .shoe{right:-10px}

    width:90px;
    height:75px;
    background:linear-gradient(
